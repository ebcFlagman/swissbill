name: CI

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      # better-sqlite3 ships prebuilt binaries; without --ignore-scripts npm would try to compile it.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install Electron binary
        run: node node_modules/electron/install.js

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and integration tests
        run: npm test

      - name: Build and package
        run: npm run package
        env:
          # Optional: without the secret (e.g. forks) the app builds with a license banner.
          VITE_PRIMEUI_LICENSE: ${{ secrets.PRIMEUI_LICENSE }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: swissbill-win-unpacked-${{ github.sha }}
          path: release/win-unpacked/
          retention-days: 14
          if-no-files-found: error

  # The same tests against PostgreSQL, MySQL and MariaDB (feature 006). The `verify` job runs SQLite only, because
  # Windows runners cannot start Linux service containers. Independent of `verify`: neither blocks the other.
  db-matrix:
    name: db-matrix
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: swissbill
          POSTGRES_PASSWORD: test
          POSTGRES_DB: swissbill
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U swissbill" --health-interval 5s --health-timeout 5s --health-retries 20
      mysql:
        image: mysql:26
        env:
          MYSQL_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -proot" --health-interval 5s --health-timeout 5s --health-retries 30
      mariadb:
        image: mariadb:13
        env:
          MARIADB_ROOT_PASSWORD: root
        ports: ['3307:3306']
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized" --health-interval 5s --health-timeout 5s --health-retries 30
    env:
      # Test databases only. The users may create databases: every test gets its own fresh one.
      SWISSBILL_TEST_PG_URL: postgres://swissbill:test@localhost:5432/swissbill
      SWISSBILL_TEST_MYSQL_URL: mysql://root:root@localhost:3306/
      SWISSBILL_TEST_MARIADB_URL: mysql://root:root@localhost:3307/
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Unit and integration tests on all database types
        run: npm test

  # Optional: not a required check. A failure turns the run red but blocks neither verify nor the artifact.
  e2e:
    name: e2e
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install Electron binary
        run: node node_modules/electron/install.js

      - name: Download packaged app
        uses: actions/download-artifact@v8
        with:
          name: swissbill-win-unpacked-${{ github.sha }}
          path: release/win-unpacked/

      - name: End-to-end tests
        run: npm run test:e2e
        env:
          VITE_PRIMEUI_LICENSE: ${{ secrets.PRIMEUI_LICENSE }}

      - name: Summarize test results
        if: always()
        shell: pwsh
        run: |
          $file = 'playwright-report/junit.xml'
          if (Test-Path $file) {
            $s = ([xml](Get-Content $file)).testsuites
            $passed = [int]$s.tests - [int]$s.failures - [int]$s.errors - [int]$s.skipped
            "### E2E-Testergebnis`n`n| Gesamt | Bestanden | Fehlgeschlagen | Übersprungen |`n|---|---|---|---|`n| $($s.tests) | $passed | $([int]$s.failures + [int]$s.errors) | $($s.skipped) |" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          } else {
            'Keine E2E-Testergebnisse vorhanden.' | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          }

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-reports-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: ignore
