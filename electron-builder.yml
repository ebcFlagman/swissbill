appId: ch.flagmansworld.swissbill
productName: SwissBill
directories:
  output: release
files:
  - out/**/*
  - package.json
asarUnpack:
  - node_modules/better-sqlite3/**
win:
  target:
    - target: nsis
      arch: [x64]
npmRebuild: false
artifactName: ${productName}-${version}-${os}-${arch}.${ext}
linux:
  target:
    - target: AppImage
      arch: [x64]
  category: Office
