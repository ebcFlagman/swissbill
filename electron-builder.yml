appId: ch.flagmansworld.swissbill
productName: SwissBill
directories:
  output: release
files:
  - out/**/*
  - package.json
asarUnpack:
  - node_modules/better-sqlite3/**
win:
  target:
    - target: nsis
      arch: [x64]
npmRebuild: false
linux:
  target:
    - target: AppImage
      arch: [x64]
  category: Office
nsis:
  artifactName: ${productName}-${version}-win-x64.${ext}
appImage:
  artifactName: ${productName}-${version}-linux-x64.${ext}
